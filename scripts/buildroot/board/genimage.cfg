image boot.vfat {
  vfat {
    extraargs = "-F 16 -n EXTMONITOR"
    files = {
      "bcm2708-rpi-zero.dtb",
      "rpi-firmware/bootcode.bin",
      "rpi-firmware/cmdline.txt",
      "rpi-firmware/config.txt",
      "rpi-firmware/fixup.dat",
      "rpi-firmware/start.elf",
      "rpi-firmware/overlays",
      "zImage"
    }
  }
  size = 32M
}

image sdcard.img {
  hdimage {
  }

  partition boot {
    partition-type = 0xE
    bootable = "true"
    image = "boot.vfat"
  }
}
